name: Bug report
about: Report a toolkit/GUI/setup problem (not a known-bad WGP result)
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Save your work before reproducing hardware-changing bugs.** Remove usernames, IPs and other private data from logs.
  - type: input
    id: version
    attributes:
      label: BC-250 CU Unlock Suite version
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - CachyOS
        - Arch Linux
        - SteamOS
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command/action, expected behavior and actual behavior.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant terminal output
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private information from the logs.
          required: true
